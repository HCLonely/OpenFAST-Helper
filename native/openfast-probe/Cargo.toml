[package]
name = "openfast-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Security"] }

[profile.release]
lto = true
strip = true
opt-level = 2
